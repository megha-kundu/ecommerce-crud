<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Product - FashionHub</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .product-page {
            max-width: 900px;
            margin: 40px auto;
        }

        .product-form-card {
            background: #fff;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        .page-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .page-title h2 {
            margin: 0;
        }

        .back-btn {
            border: none;
            background: #f1f1f1;
            padding: 10px 16px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
        }

        .current-image {
            width: 200px;
            height: 200px;
            margin-top: 12px;
            border-radius: 14px;
            overflow: hidden;
            background: #f5f5f5;
        }

        .current-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .save-btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            background: #111;
            color: white;
        }

        .save-btn:hover {
            opacity: .9;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            font-size: 18px;
        }

        .page-note {
            color: #777;
            font-size: 13px;
            margin-top: 6px;
        }

        @media (max-width: 600px) {

            .product-page {
                margin: 20px 12px;
            }

            .product-form-card {
                padding: 20px;
            }

            .two-col {
                grid-template-columns: 1fr;
            }

            .page-title {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>

</head>

<body>


<!-- NAVBAR -->

<nav class="navbar">

    <a
        href="index.html"
        class="logo"
    >
        Fashion<span>Hub</span>
    </a>

    <div class="nav-links">

        <a href="index.html">
            Store
        </a>

        <a
            href="admin.html"
            class="active"
        >
            Dashboard
        </a>

    </div>

    <div class="nav-actions">

        <span class="profile-name">
            👋
            <span id="adminName">
                Admin
            </span>
        </span>

        <button
            class="btn-logout"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</nav>


<main class="container product-page">

    <div
        class="product-form-card"
        id="editCard"
    >

        <div class="loading">
            ⏳ Loading product...
        </div>

    </div>

</main>


<div
    class="toast"
    id="toast"
></div>


<script>

const API =
    "http://localhost/ecommerce-crud/php-api";


const DEFAULT_IMAGE =
    "https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=600&auto=format&fit=crop&q=80";


let productId = null;


// =====================================
// PAGE LOAD
// =====================================

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const name =
            localStorage.getItem("userName") ||
            localStorage.getItem("name") ||
            localStorage.getItem("username") ||
            "Admin";

        document.getElementById(
            "adminName"
        ).textContent = name;


        const params =
            new URLSearchParams(
                window.location.search
            );


        productId =
            params.get("id");


        if (!productId) {

            showError(
                "Product ID missing."
            );

            return;
        }


        loadProduct();

    }
);


// =====================================
// LOAD PRODUCT
// =====================================

async function loadProduct() {

    try {

        const response =
            await fetch(
                `${API}/products.php?id=${encodeURIComponent(productId)}`
            );


        const result =
            await response.json();


        if (
            !result.success ||
            !result.data
        ) {

            throw new Error(
                result.message ||
                "Product not found"
            );
        }


        renderEditForm(
            result.data
        );


    } catch (error) {

        console.error(error);

        showError(
            error.message ||
            "Unable to load product"
        );

    }

}


// =====================================
// EDIT FORM
// =====================================

function renderEditForm(product) {

    const card =
        document.getElementById(
            "editCard"
        );


    const image =
        product.image ||
        DEFAULT_IMAGE;


    card.innerHTML = `

        <div class="page-title">

            <div>

                <h2>
                    ✏️ Edit Product
                </h2>

                <p class="page-note">
                    Update your product information.
                </p>

            </div>

            <button
                class="back-btn"
                onclick="goDashboard()"
            >
                ← Dashboard
            </button>

        </div>


        <form
            id="editProductForm"
        >


            <div class="form-group">

                <label>
                    Product Name *
                </label>

                <input
                    type="text"
                    id="pName"
                    value="${escapeHTML(product.name || "")}"
                    required
                >

            </div>


            <div class="two-col">

                <div class="form-group">

                    <label>
                        Brand
                    </label>

                    <input
                        type="text"
                        id="pBrand"
                        value="${escapeHTML(product.brand || "")}"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <select id="pCategory">

                        <option value="">
                            Select Category
                        </option>

                        <option value="Men">
                            Men
                        </option>

                        <option value="Women">
                            Women
                        </option>

                        <option value="Footwear">
                            Footwear
                        </option>

                        <option value="Accessories">
                            Accessories
                        </option>

                    </select>

                </div>

            </div>


            <div class="two-col">

                <div class="form-group">

                    <label>
                        Price (₹) *
                    </label>

                    <input
                        type="number"
                        id="pPrice"
                        value="${product.price || ""}"
                        min="1"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        MRP (₹)
                    </label>

                    <input
                        type="number"
                        id="pMrp"
                        value="${product.mrp || ""}"
                        min="0"
                    >

                </div>

            </div>


            <div class="form-group">

                <label>
                    Image URL
                </label>

                <input
                    type="url"
                    id="pImage"
                    value="${escapeHTML(product.image || "")}"
                    placeholder="https://..."
                >

                <p class="page-note">
                    Image URL change karoge to new image use hogi.
                    Empty rakhoge to automatic product image use hogi.
                </p>


                <div class="current-image">

                    <img
                        id="imagePreview"
                        src="${escapeHTML(image)}"
                        alt="${escapeHTML(product.name || "Product")}"
                        onerror="
                            this.onerror=null;
                            this.src='${DEFAULT_IMAGE}';
                        "
                    >

                </div>

            </div>


            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    id="pDesc"
                    rows="5"
                >${escapeHTML(product.description || "")}</textarea>

            </div>


            <button
                type="submit"
                class="save-btn"
            >
                💾 Update Product
            </button>

        </form>
    `;


    document.getElementById(
        "pCategory"
    ).value =
        product.category || "";


    document.getElementById(
        "pImage"
    ).addEventListener(
        "input",
        function () {

            const value =
                this.value.trim();

            const preview =
                document.getElementById(
                    "imagePreview"
                );


            if (value) {

                preview.src =
                    value;

            } else {

                preview.src =
                    DEFAULT_IMAGE;
            }

        }
    );


    document.getElementById(
        "editProductForm"
    ).addEventListener(
        "submit",
        updateProduct
    );

}


// =====================================
// UPDATE PRODUCT
// =====================================

async function updateProduct(event) {

    event.preventDefault();


    const data = {

        id: Number(productId),

        name:
            document
                .getElementById("pName")
                .value
                .trim(),

        brand:
            document
                .getElementById("pBrand")
                .value
                .trim(),

        category:
            document
                .getElementById("pCategory")
                .value
                .trim(),

        price:
            Number(
                document
                    .getElementById("pPrice")
                    .value
            ),

        mrp:
            Number(
                document
                    .getElementById("pMrp")
                    .value
            ) || 0,

        image:
            document
                .getElementById("pImage")
                .value
                .trim(),

        description:
            document
                .getElementById("pDesc")
                .value
                .trim()

    };


    if (!data.name) {

        showToast(
            "Product name required",
            "error"
        );

        return;
    }


    if (!data.price || data.price <= 0) {

        showToast(
            "Valid price enter karo",
            "error"
        );

        return;
    }


    try {

        const response =
            await fetch(
                `${API}/products.php`,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(data)
                }
            );


        const result =
            await response.json();


        if (!result.success) {

            throw new Error(
                result.message ||
                "Product update failed"
            );
        }


        showToast(
            "✅ Product updated successfully!",
            "success"
        );


        setTimeout(
            function () {

                window.location.href =
                    "admin.html";

            },
            1000
        );


    } catch (error) {

        console.error(error);

        showToast(
            error.message ||
            "Update failed",
            "error"
        );

    }

}


// =====================================
// DASHBOARD
// =====================================

function goDashboard() {

    window.location.href =
        "admin.html";
}


// =====================================
// LOGOUT
// =====================================

function logout() {

    localStorage.removeItem("user");
    localStorage.removeItem("userName");
    localStorage.removeItem("name");
    localStorage.removeItem("username");
    localStorage.removeItem("email");

    window.location.href =
        "login.html";
}


// =====================================
// ERROR
// =====================================

function showError(message) {

    document.getElementById(
        "editCard"
    ).innerHTML = `

        <div class="loading">

            ❌ ${escapeHTML(message)}

            <br><br>

            <button
                class="back-btn"
                onclick="goDashboard()"
            >
                ← Back to Dashboard
            </button>

        </div>
    `;
}


// =====================================
// TOAST
// =====================================

function showToast(
    message,
    type = "success"
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.className =
        "toast show " + type;


    setTimeout(
        function () {

            toast.classList.remove(
                "show"
            );

        },
        3000
    );
}


// =====================================
// ESCAPE HTML
// =====================================

function escapeHTML(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}

</script>

</body>
</html>
