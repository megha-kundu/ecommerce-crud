<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Product - FashionHub</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .product-page {
            max-width: 900px;
            margin: 40px auto;
        }

        .product-form-card {
            background: #fff;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        .page-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            gap: 15px;
        }

        .page-title h2 {
            margin: 0;
        }

        .back-btn {
            border: none;
            background: #f1f1f1;
            padding: 10px 16px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        .back-btn:hover {
            background: #e5e5e5;
        }

        .product-form-card .form-group {
            margin-bottom: 18px;
        }

        .product-form-card label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .product-form-card input,
        .product-form-card select,
        .product-form-card textarea {
            width: 100%;
            box-sizing: border-box;
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .image-preview {
            margin-top: 12px;
            width: 180px;
            height: 180px;
            border-radius: 14px;
            overflow: hidden;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .save-btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            background: #111;
            color: #fff;
            margin-top: 10px;
        }

        .save-btn:hover {
            opacity: .9;
        }

        .page-note {
            color: #777;
            font-size: 13px;
            margin-top: 6px;
        }

        @media (max-width: 600px) {

            .product-page {
                margin: 20px 12px;
            }

            .product-form-card {
                padding: 20px;
            }

            .two-col {
                grid-template-columns: 1fr;
            }

            .page-title {
                align-items: flex-start;
                flex-direction: column;
            }

        }

    </style>

</head>

<body>


<!-- NAVBAR -->

<nav class="navbar">

    <a
        href="index.html"
        class="logo"
    >
        Fashion<span>Hub</span>
    </a>

    <div class="nav-links">

        <a href="index.html">
            Store
        </a>

        <a
            href="admin.html"
            class="active"
        >
            Dashboard
        </a>

    </div>

    <div class="nav-actions">

        <span class="profile-name">
            👋
            <span id="adminName">
                Admin
            </span>
        </span>

        <button
            class="btn-logout"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</nav>


<!-- PAGE -->

<main class="container product-page">

    <div class="product-form-card">

        <div class="page-title">

            <div>

                <h2>
                    ➕ Add New Product
                </h2>

                <p class="page-note">
                    Add a new product to your FashionHub store.
                </p>

            </div>

            <button
                class="back-btn"
                onclick="goDashboard()"
            >
                ← Dashboard
            </button>

        </div>


        <form id="addProductForm">


            <!-- NAME -->

            <div class="form-group">

                <label>
                    Product Name *
                </label>

                <input
                    type="text"
                    id="pName"
                    placeholder="e.g. Running Shoes"
                    required
                >

            </div>


            <!-- BRAND + CATEGORY -->

            <div class="two-col">

                <div class="form-group">

                    <label>
                        Brand
                    </label>

                    <input
                        type="text"
                        id="pBrand"
                        placeholder="e.g. Nike"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <select id="pCategory">

                        <option value="">
                            Select Category
                        </option>

                        <option value="Men">
                            Men
                        </option>

                        <option value="Women">
                            Women
                        </option>

                        <option value="Footwear">
                            Footwear
                        </option>

                        <option value="Accessories">
                            Accessories
                        </option>

                    </select>

                </div>

            </div>


            <!-- PRICE + MRP -->

            <div class="two-col">

                <div class="form-group">

                    <label>
                        Price (₹) *
                    </label>

                    <input
                        type="number"
                        id="pPrice"
                        placeholder="999"
                        min="1"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        MRP (₹)
                    </label>

                    <input
                        type="number"
                        id="pMrp"
                        placeholder="1499"
                        min="0"
                    >

                </div>

            </div>


            <!-- IMAGE -->

            <div class="form-group">

                <label>
                    Image URL
                </label>

                <input
                    type="url"
                    id="pImage"
                    placeholder="https://example.com/product.jpg"
                >

                <div class="page-note">
                    💡 Image URL empty chhodoge to Pexels se
                    product name ke according image automatically milegi.
                </div>


                <div
                    class="image-preview"
                    id="imagePreview"
                >

                    <span>
                        🖼️ Preview
                    </span>

                </div>

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    id="pDesc"
                    rows="5"
                    placeholder="Product description..."
                ></textarea>

            </div>


            <!-- SAVE -->

            <button
                type="submit"
                class="save-btn"
            >
                💾 Add Product
            </button>

        </form>

    </div>

</main>


<div
    class="toast"
    id="toast"
></div>


<script>

const API =
    "http://localhost/ecommerce-crud/php-api";


const PEXELS_API =
    API + "/pexels.php";


const DEFAULT_IMAGE =
    "https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=600&auto=format&fit=crop&q=80";


document.addEventListener(
    "DOMContentLoaded",
    function () {

        const name =
            localStorage.getItem("userName") ||
            localStorage.getItem("name") ||
            localStorage.getItem("username") ||
            "Admin";

        document.getElementById(
            "adminName"
        ).textContent = name;


        document
            .getElementById("pImage")
            .addEventListener(
                "input",
                previewImage
            );


        document
            .getElementById("addProductForm")
            .addEventListener(
                "submit",
                addProduct
            );

    }
);


// =====================================
// IMAGE PREVIEW
// =====================================

function previewImage() {

    const url =
        document
            .getElementById("pImage")
            .value
            .trim();

    const preview =
        document.getElementById(
            "imagePreview"
        );


    if (!url) {

        preview.innerHTML =
            "<span>🖼️ Preview</span>";

        return;
    }


    preview.innerHTML = `
        <img
            src="${escapeHTML(url)}"
            onerror="
                this.onerror=null;
                this.src='${DEFAULT_IMAGE}';
            "
            alt="Preview"
        >
    `;
}


// =====================================
// ADD PRODUCT
// =====================================

async function addProduct(event) {

    event.preventDefault();


    const name =
        document
            .getElementById("pName")
            .value
            .trim();


    const brand =
        document
            .getElementById("pBrand")
            .value
            .trim();


    const category =
        document
            .getElementById("pCategory")
            .value
            .trim();


    const price =
        Number(
            document
                .getElementById("pPrice")
                .value
        );


    const mrp =
        Number(
            document
                .getElementById("pMrp")
                .value
        ) || 0;


    const image =
        document
            .getElementById("pImage")
            .value
            .trim();


    const description =
        document
            .getElementById("pDesc")
            .value
            .trim();


    if (!name) {

        showToast(
            "Product name required",
            "error"
        );

        return;
    }


    if (!price || price <= 0) {

        showToast(
            "Valid price enter karo",
            "error"
        );

        return;
    }


    const product = {

        name: name,

        brand: brand,

        price: price,

        mrp: mrp,

        category: category,

        image: image,

        description: description

    };


    try {

        const response =
            await fetch(
                `${API}/products.php`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(product)
                }
            );


        const result =
            await response.json();


        if (!result.success) {

            throw new Error(
                result.message ||
                "Product add nahi hua"
            );
        }


        showToast(
            "✅ Product added successfully!",
            "success"
        );


        setTimeout(
            function () {

                window.location.href =
                    "admin.html";

            },
            1000
        );


    } catch (error) {

        console.error(error);

        showToast(
            error.message ||
            "Product add nahi hua",
            "error"
        );

    }

}


// =====================================
// DASHBOARD
// =====================================

function goDashboard() {

    window.location.href =
        "admin.html";
}


// =====================================
// LOGOUT
// =====================================

function logout() {

    localStorage.removeItem("user");
    localStorage.removeItem("userName");
    localStorage.removeItem("name");
    localStorage.removeItem("username");
    localStorage.removeItem("email");

    window.location.href =
        "login.html";
}


// =====================================
// TOAST
// =====================================

function showToast(
    message,
    type = "success"
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.className =
        "toast show " + type;


    setTimeout(
        function () {

            toast.classList.remove(
                "show"
            );

        },
        3000
    );
}


// =====================================
// ESCAPE HTML
// =====================================

function escapeHTML(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}

</script>

</body>
</html>
