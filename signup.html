<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup - FashionHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-banner">
        <h2>Create Account 🎉</h2>
        <p>Join FashionHub & start shopping</p>
      </div>
      <div class="auth-form">
        <div class="auth-logo">Fashion<span>Hub</span></div>
        <div class="msg" id="msg"></div>
        <form onsubmit="handleSignup(event)">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Min 6 characters" required>
          </div>
          <button type="submit" class="btn-full">SIGN UP</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="login.html">Login</a></p>
        <p class="auth-footer"><a href="index.html">← Back to Store</a></p>
      </div>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
