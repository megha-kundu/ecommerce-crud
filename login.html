<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login -FashionFactory</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-banner">
        <h2>Welcome Back 👋</h2>
        <p>Login to manage your fashion store</p>
      </div>
      <div class="auth-form">
        <div class="auth-logo">Fashion<span>Factory</span></div>
        <div class="msg" id="msg"></div>
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
          </div>
          <button type="submit" class="btn-full">LOGIN</button>
        </form>
        <p class="auth-footer">New to FashionHub? <a href="signup.html">Create Account</a></p>
        <p class="auth-footer"><a href="index.html">← Back to Store</a></p>
      </div>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
